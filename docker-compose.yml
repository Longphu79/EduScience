name: eduscience

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet mongodb://127.0.0.1:27017/admin --eval \"db.adminCommand('ping').ok\" | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  seed:
    build:
      context: ./backend
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/eduscience
    command: ["npm", "run", "seed:qa"]
    restart: "no"

  backend:
    build:
      context: ./backend
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/eduscience
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      API_BASE_URL: http://backend:4000
      INTERNAL_API_BASE_URL: http://backend:4000
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mongo-data:
